<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-faruk Super App Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --card-dark: #121212;
            --primary-gold: #b37409;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
            --accent-green: #0bda51;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0; padding: 0; padding-bottom: 75px;
            box-sizing: border-box;
        }

        .top-navbar {
            background-color: var(--card-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-title { font-size: 18px; font-weight: 800; color: var(--primary-gold); }
        
        .lang-toggle {
            background: rgba(179, 116, 9, 0.15); color: var(--primary-gold);
            border: 1px solid var(--primary-gold); padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
        }

        .view-section { display: none; padding: 16px; }
        .view-section.active { display: block; }

        .user-card {
            background-color: var(--card-dark); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px;
        }

        .avatar {
            width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary-gold), #5a3a04);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;
        }

        .badge-premium {
            background: rgba(11, 218, 81, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green);
            padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
        }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .metric-box { background-color: var(--card-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; text-align: center; }
        .metric-box div:first-child { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .metric-box div:last-child { font-size: 20px; font-weight: 700; color: var(--primary-gold); }

        .form-panel { background-color: var(--card-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        select, textarea, input { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-light); padding: 12px; border-radius: 8px; box-sizing: border-box; }

        .action-button { width: 100%; background-color: var(--primary-gold); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* ADVANCED SUPPORT CONVERSATIONAL TIMELINE CHAT GRID */
        .ticket-chat-wrapper { background-color: var(--card-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-top: 16px; }
        .ticket-thread-meta { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
        
        .chat-bubble-stream { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 5px; margin-bottom: 12px; }
        .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .bubble.customer { background-color: var(--primary-gold); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bubble.support { background-color: #222222; color: #f5f5f5; align-self: flex-start; border-bottom-left-radius: 2px; }

        .inline-chat-input-bar { display: flex; gap: 8px; }
        .inline-chat-input-bar input { flex: 1; padding: 10px; }
        .inline-chat-input-bar button { background-color: var(--primary-gold); color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: 700; }

        .referral-banner { background: linear-gradient(135deg, #1c1303 0%, var(--card-dark) 100%); border: 1px solid var(--primary-gold); border-radius: 14px; padding: 20px; text-align: center; }
        .referral-link-box { background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
        .referral-url { font-size: 12px; color: var(--primary-gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background-color: var(--primary-gold); border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background-color: var(--card-dark); border-top: 1px solid var(--border-color); display: flex; align-items: center; z-index: 200; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); background: none; border: none; width: 33.33%; font-size: 11px; font-weight: 600; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--primary-gold); }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="brand-title" id="app-brand">AL-FARUK HUB</div>
        <button class="lang-toggle" id="lang-btn" onclick="toggleLanguage()">አማርኛ</button>
    </div>

    <div id="view-dashboard" class="view-section active">
        <div class="user-card">
            <div class="avatar" id="avatar-char">U</div>
            <div class="user-meta">
                <h4 id="user-display-name">Loading Profile...</h4>
                <span class="badge-premium" id="premium-status">Premium Verified</span>
            </div>
        </div>
        <div class="dashboard-grid">
            <div class="metric-box">
                <div id="lbl-wallet-points">My Wallet Points</div>
                <div id="val-points">0 pts</div>
            </div>
            <div class="metric-box">
                <div id="lbl-active-tickets">Open Tickets</div>
                <div id="val-tickets">0</div>
            </div>
        </div>
    </div>

    <div id="view-support" class="view-section">
        <div class="form-panel" id="ticket-creation-pod">
            <form id="supportForm" onsubmit="createNewTicket(event)">
                <div class="form-group">
                    <label id="lbl-issue-type">Choose Category</label>
                    <select id="issueType">
                        <option value="Technical Issue">Technical Issue</option>
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Feedback">Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-desc">Message Description</label>
                    <textarea id="issueDescription" rows="3" placeholder="Provide problem details..." required></textarea>
                </div>
                <button type="submit" class="action-button" id="btn-submit-ticket">Launch Ticket</button>
            </form>
        </div>

        <div id="active-chat-threads-hook"></div>
    </div>

    <div id="view-referrals" class="view-section">
        <div class="referral-banner">
            <h3 style="margin: 0 0 8px 0; color: var(--primary-gold);" id="lbl-ref-title">Invite Friends & Earn Points</h3>
            <p style="margin:0; font-size:13px; color:var(--text-muted);" id="lbl-ref-desc">Earn 500 points instantly for every active community signup.</p>
            <div class="referral-link-box">
                <div class="referral-url" id="referral-link-txt">Generating Link...</div>
                <button class="copy-btn" onclick="copyLink()" id="btn-copy">Copy</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchView('dashboard', this)"><span>📊</span><span id="nav-lbl-dash">Dashboard</span></button>
        <button class="nav-item" onclick="switchView('support', this)"><span>🛠️</span><span id="nav-lbl-supp">Support</span></button>
        <button class="nav-item" onclick="switchView('referrals', this)"><span>🎁</span><span id="nav-lbl-ref">Referrals</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        // CHANGE THIS BACKEND ENDPOINT EXACTLY TO MATCH YOUR PRODUCTION HOIST IP/URL (e.g., PythonAnywhere address)
        const BACKEND_API_URL = "http://localhost:8080"; 

        let userId = "9999999";
        let userName = "Al-faruk Customer";
        let currentLang = 'en';

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id.toString();
            userName = `${tg.initDataUnsafe.user.first_name || ''} ${tg.initDataUnsafe.user.last_name || ''}`.trim();
        }

        document.getElementById('user-display-name').innerText = userName;
        document.getElementById('avatar-char').innerText = userName.charAt(0).toUpperCase();
        document.getElementById('referral-link-txt').innerText = `https://t.me/AlFarukSupportBot?start=ref_${userId}`;

        // Long-polling fetch synchronization wrapper to keep communication channels up to date live
        async function synchroniseEcosystemState() {
            try {
                const res = await fetch(`${BACKEND_API_URL}/api/user/${userId}`);
                const data = await res.json();
                
                document.getElementById('val-points').innerText = `${data.points} pts`;
                document.getElementById('val-tickets').innerText = data.tickets.filter(t => t.status === "Open").length;
                
                renderLiveConversations(data.tickets);
            } catch (e) { console.error("Synchronization delay: ", e); }
        }

        function renderLiveConversations(tickets) {
            const container = document.getElementById('active-chat-threads-hook');
            if (!tickets || tickets.length === 0) {
                container.innerHTML = "";
                document.getElementById('ticket-creation-pod').style.display = "block";
                return;
            }

            // If an open conversation thread exists, minimize the input form panel to prevent duplicates
            const activeOpen = tickets.find(t => t.status === "Open");
            if (activeOpen) {
                document.getElementById('ticket-creation-pod').style.display = "none";
                
                container.innerHTML = `
                    <div class="ticket-chat-wrapper">
                        <div class="ticket-thread-meta">
                            <span>💬 ${activeOpen.category}</span>
                            <span style="color: var(--primary-gold);">STATUS: ACTIVE</span>
                        </div>
                        <div class="chat-bubble-stream" id="bubble-scroller">
                            ${activeOpen.messages.map(m => `
                                <div class="bubble ${m.sender}">${m.text}</div>
                            `).join('')}
                        </div>
                        <div class="inline-chat-input-bar">
                            <input type="text" id="followUpText" placeholder="Type reply message here..." />
                            <button onclick="submitFollowUpReply('${activeOpen.category}')">Send</button>
                        </div>
                    </div>
                `;
                
                // Auto-scroll conversational feed to the bottommost message bubble
                const pane = document.getElementById('bubble-scroller');
                if (pane) pane.scrollTop = pane.scrollHeight;
            } else {
                document.getElementById('ticket-creation-pod').style.display = "block";
                container.innerHTML = "";
            }
        }

        async function createNewTicket(event) {
            event.preventDefault();
            const type = document.getElementById('issueType').value;
            const desc = document.getElementById('issueDescription').value;

            await fetch(`${BACKEND_API_URL}/api/ticket/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, user_name: userName, issue_type: type, description: desc })
            });

            document.getElementById('issueDescription').value = "";
            synchroniseEcosystemState();
        }

        async function submitFollowUpReply(category) {
            const inputField = document.getElementById('followUpText');
            const text = inputField.value.trim();
            if (!text) return;

            await fetch(`${BACKEND_API_URL}/api/ticket/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, user_name: userName, issue_type: category, description: text })
            });

            inputField.value = "";
            synchroniseEcosystemState();
        }

        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            element.classList.add('active');
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('referral-link-txt').innerText);
            alert("Referral link copied!");
        }

        // Run recurring checks every 3 seconds to pull live agent responses instantly onto the dashboard
        setInterval(synchroniseEcosystemState, 3000);
        synchroniseEcosystemState();
    </script>
</body>
</html>
